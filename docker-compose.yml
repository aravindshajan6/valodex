services:
  db:
    image: postgres:16-alpine
    container_name: valorum-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: valorum
      POSTGRES_PASSWORD: valorum
      POSTGRES_DB: valorum
    ports:
      - "5432:5432"
    volumes:
      - valorum-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valorum"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  valorum-pgdata:

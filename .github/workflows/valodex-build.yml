# Commit to the valodex repo as: .github/workflows/valodex-build.yml
# Builds the image and pushes to GHCR on every push to main.
# NOTE: valodex prerenders pages from the DB at build time, so CI spins up a
# throwaway Postgres, applies the schema, and runs the sync before building.
name: valodex build & push
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: valodex
          POSTGRES_PASSWORD: valodex
          POSTGRES_DB: valodex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U valodex"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://valodex:valodex@localhost:5432/valodex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run db:push          # create schema in the throwaway DB
      - run: npm run sync             # populate from valorant-api.com
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/aravindshajan6/valodex
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          network: host                # so the build can reach the Postgres service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            DATABASE_URL=postgres://valodex:valodex@localhost:5432/valodex
            NEXT_PUBLIC_SITE_URL=https://valodex.sapper.top
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID }}
